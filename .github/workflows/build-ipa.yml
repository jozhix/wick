name: Build unsigned IPA

# Builds the tvOS app on a GitHub macOS runner and uploads an UNSIGNED .ipa.
# atvloadly signs it with your Apple ID and installs it.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project AetherPlayer.xcodeproj -scheme AetherPlayer

      - name: Build (unsigned, tvOS device SDK)
        run: |
          set -o pipefail
          xcodebuild build \
            -project AetherPlayer.xcodeproj \
            -scheme AetherPlayer \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -n 60

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name 'AetherPlayer.app' | head -1)
          test -n "$APP" || { echo "AetherPlayer.app not found"; exit 1; }
          rm -rf Payload AetherPlayer.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry AetherPlayer.ipa Payload
          ls -lh AetherPlayer.ipa
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$APP/Info.plist"
          ls "$APP/Frameworks" || true

      - uses: actions/upload-artifact@v4
        with:
          name: AetherPlayer-ipa
          path: AetherPlayer.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
